<?xml version="1.0" encoding="UTF-8"?>
<!--
  Speaker: VOID Air Vantage — side view
  Source PNG: 05-speaker-assets/png/void-air-vantage-side.png
              05-speaker-assets/png/void-air-vantage-dims.png
  Actual dimensions: D 660mm [26.0"] × H 415mm [16.3"]
  Profile: Wide-dispersion horn-loaded DJ monitor / stage monitor
  Side profile shows: horn mouth (left, flared open), tapered horn body,
    rear cabinet box with rounded top, mounting foot/bracket at base
  Drawn: 2026-04-28
  Methodology: 06-reference-docs/svg-drawing-methodology.md
-->
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 600 500" width="600" height="500"
     role="img"
     aria-labelledby="avs-title avs-desc">

  <title id="avs-title">VOID Air Vantage — Side Elevation</title>
  <desc id="avs-desc">Technical side-profile drawing of the VOID Air Vantage horn-loaded
    DJ monitor. Dimensions: D 660mm [26.0"] × H 415mm [16.3"].
    Source: void-air-vantage-dims.png.</desc>

  <defs>
    <style>
      text { font-family: 'Segoe UI', Arial, sans-serif; }
      .lbl  { fill: #f0f6fc; font-size: 13px; font-weight: 700; text-anchor: middle; }
      .sub  { fill: #8b949e; font-size: 9px; text-anchor: middle; }
      .dim  { fill: #fcd34d; font-size: 9px; font-family: 'Segoe UI Mono', monospace; text-anchor: middle; }
      .dln  { stroke: #4b5563; stroke-width: 0.5; fill: none; }
      .body { fill: #1e293b; stroke: #475569; stroke-width: 1.5; }
      .detail { fill: none; stroke: #334155; stroke-width: 0.8; stroke-dasharray: 4,3; }
      .mount { fill: #111827; stroke: #475569; stroke-width: 1; }
    </style>
    <!-- Arrowheads for dimension lines -->
    <marker id="arr" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#fcd34d"/>
    </marker>
    <marker id="arr-rev" markerWidth="6" markerHeight="6" refX="1" refY="3"
            orient="auto-start-reverse">
      <path d="M6,0 L0,3 L6,6 Z" fill="#fcd34d"/>
    </marker>
  </defs>

  <!-- ── Background ─────────────────────────────────────────────────── -->
  <rect width="600" height="500" fill="#0d1117"/>

  <!-- ── Title header ───────────────────────────────────────────────── -->
  <text x="300" y="22" class="lbl">VOID AIR VANTAGE — SIDE ELEVATION</text>
  <text x="300" y="34" class="sub">D 660 mm [26.0 in] × H 415 mm [16.3 in]</text>
  <line x1="40" y1="40" x2="560" y2="40" stroke="#1e293b" stroke-width="1"/>

  <!-- ══════════════════════════════════════════════════════════════════
       SIDE PROFILE
       Canvas region: x 70–530, y 55–435
       Scale: 660mm → 460px = 0.697 px/mm
              415mm → 289px = 0.697 px/mm
       Origin (horn mouth top-left): x=70, y=55
       Cabinet right edge (rear box right): x=530
       Cabinet bottom: y=344   Horn mouth height: y=55–344 (289px = 415mm)
       Rear box: x=400–530 (130px ≈ 186mm), y=120–344 (224px ≈ 321mm)
       ══════════════════════════════════════════════════════════════════ -->

  <!--
    Air Vantage side profile geometry (from dims PNG):
    - Horn mouth opens wide on the LEFT (tall opening, full height)
    - Horn body tapers to the right toward the rear cabinet
    - Rear cabinet is a box with a rounded dome top
    - Mounting foot / bracket is at the very bottom-centre

    Key polygon points (approx, scaled):
      Horn mouth top:    (70,  55)
      Horn mouth bottom: (70, 344)
      Horn taper top:    converges toward rear box top-left at ~(400, 120)
      Horn taper bottom: converges toward rear box bottom-left at ~(400, 344)
      Rear box top-left: (400, 120)
      Rear box top-right: (530, 120) — with dome rounded top
      Rear box bottom-right: (530, 344)
      Rear box bottom-left: (400, 344)
  -->

  <!-- ── Horn body (trapezoidal, tapers left→right) ─────────────────── -->
  <!-- Main horn flare shape — wide mouth left, narrow throat right -->
  <polygon class="body"
    points="70,55 70,344 400,344 400,120 70,55"/>

  <!-- Horn internal acoustic profile (dashed guide lines) -->
  <!-- Upper horn flare curve guide -->
  <path class="detail" d="M 70,80 Q 200,95 400,120"/>
  <!-- Lower horn flare curve guide -->
  <path class="detail" d="M 70,319 Q 200,330 400,344"/>
  <!-- Centre horn axis line -->
  <path class="detail" d="M 70,200 Q 230,215 400,232"/>

  <!-- ── Rear cabinet (rectangular box with dome top) ───────────────── -->
  <!-- Rear box body -->
  <rect class="body" x="400" y="165" width="130" height="179" rx="2"/>
  <!-- Rounded dome top of rear cabinet -->
  <path class="body" d="M 400,165 Q 465,100 530,165"/>

  <!-- ── Horn mouth edge / flange ───────────────────────────────────── -->
  <!-- Left flange plate (horn mouth edge detail) -->
  <rect class="body" x="62" y="50" width="12" height="299" rx="1"/>

  <!-- ── Mounting bracket / foot ────────────────────────────────────── -->
  <!-- Foot bracket at base of horn, protruding below -->
  <rect class="mount" x="170" y="344" width="130" height="28" rx="2"/>
  <!-- Foot base pad -->
  <rect class="mount" x="185" y="372" width="100" height="10" rx="1"/>
  <!-- Mounting bolt holes on bracket -->
  <circle class="mount" cx="200" cy="357" r="5"/>
  <circle class="mount" cx="280" cy="357" r="5"/>

  <!-- ── Rigging / pole mount point on rear cabinet ─────────────────── -->
  <circle class="mount" cx="465" cy="300" r="8"/>
  <circle fill="none" stroke="#475569" stroke-width="0.5" cx="465" cy="300" r="4"/>

  <!-- ══════════════════════════════════════════════════════════════════
       DIMENSION LINES
       ══════════════════════════════════════════════════════════════════ -->

  <!-- Depth dimension — horizontal, below enclosure -->
  <line class="dln" x1="70" y1="418" x2="530" y2="418"/>
  <line class="dln" x1="70" y1="344" x2="70" y2="425"/>
  <line class="dln" x1="530" y1="344" x2="530" y2="425"/>
  <line class="dln" marker-start="url(#arr-rev)" marker-end="url(#arr)"
        x1="75" y1="418" x2="525" y2="418"/>
  <text class="dim" x="300" y="412">660 mm [26.0 in]</text>

  <!-- Height dimension — vertical, left of horn mouth -->
  <line class="dln" x1="30" y1="55" x2="30" y2="344"/>
  <line class="dln" x1="62" y1="55" x2="23" y2="55"/>
  <line class="dln" x1="62" y1="344" x2="23" y2="344"/>
  <line class="dln" marker-start="url(#arr-rev)" marker-end="url(#arr)"
        x1="30" y1="60" x2="30" y2="339"/>
  <text class="dim" x="16" y="202" transform="rotate(-90,16,202)">415 mm [16.3 in]</text>

  <!-- ── Labels ─────────────────────────────────────────────────────── -->
  <!-- Horn mouth label -->
  <text class="sub" x="70" y="398" text-anchor="middle">HORN MOUTH</text>
  <!-- Rear cabinet label -->
  <text class="sub" x="465" y="398" text-anchor="middle">REAR CAB</text>
  <!-- Bracket label -->
  <text class="sub" x="235" y="400" text-anchor="middle">MOUNTING FOOT</text>

  <!-- ── Footer labels ──────────────────────────────────────────────── -->
  <text x="300" y="462" class="lbl" font-size="11">VOID AIR VANTAGE</text>
  <text x="300" y="475" class="sub">Horn-Loaded DJ / Stage Monitor · Side Profile</text>
  <text x="300" y="487" class="sub">Nomad Toronto · Emblem Projects Inc. · 2026-04-28</text>

</svg>
