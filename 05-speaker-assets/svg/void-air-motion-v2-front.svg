     FOOTER
     ══════════════════════════════════════════════════════════════════ -->
<text x="450" y="698" class="foot">NOMAD TORONTO — EMBLEM PROJECTS INC. · void-air-motion-v2-front.svg · 2026-04-28</text>

</svg>
