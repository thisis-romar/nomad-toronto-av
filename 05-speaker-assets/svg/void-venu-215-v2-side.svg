<?xml version="1.0" encoding="UTF-8"?>
<!--
  Speaker: VOID Venu 215 V2 — side elevation
  Source PNG: 05-speaker-assets/png/void-venu-215-v2-dims.png
  Actual dimensions: W 636mm × H 454mm × D 860mm
  Driver(s): 2× 15″ (381mm) LF subwoofer
  View: side panel showing 4 corner handles / feet
  Drawn: 2026-04-28
  Methodology: 06-reference-docs/svg-drawing-methodology.md
-->
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 650 480" width="650" height="480"
     role="img"
     aria-labelledby="venu215-side-title venu215-side-desc">

  <title id="venu215-side-title">VOID Venu 215 V2 — Side Elevation</title>
  <desc id="venu215-side-desc">Technical line drawing of the VOID Venu 215 V2 side view.
    Dimensions: W 636mm × H 454mm × D 860mm. Four corner handles / feet shown.
    Source: void-venu-215-v2-dims.png.</desc>

  <defs>
    <style>
      text { font-family: 'Segoe UI', Arial, sans-serif; }
      .lbl  { fill: #f0f6fc; font-size: 13px; font-weight: 700; text-anchor: middle; }
      .sub  { fill: #8b949e; font-size: 9px; text-anchor: middle; }
      .dim  { fill: #fcd34d; font-size: 9px; font-family: 'Segoe UI Mono', monospace; text-anchor: middle; }
      .dim-r { fill: #fcd34d; font-size: 9px; font-family: 'Segoe UI Mono', monospace; text-anchor: middle; dominant-baseline: central; }
      .dln  { stroke: #4b5563; stroke-width: 0.75; fill: none; }
      .body { fill: #1e293b; stroke: #475569; stroke-width: 1.5; }
      .hdw  { fill: #0f172a; stroke: #475569; stroke-width: 1; }
      .bolt { fill: #1e293b; stroke: #334155; stroke-width: 0.75; }
      .callout { fill: #fcd34d; font-size: 8px; font-family: 'Segoe UI Mono', monospace; text-anchor: start; }
      .callout-line { stroke: #fcd34d; stroke-width: 0.5; fill: none; }
    </style>
    <!-- Arrowhead markers -->
    <marker id="arr-s" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#fcd34d"/>
    </marker>
    <marker id="arr-s-rev" markerWidth="6" markerHeight="6" refX="1" refY="3" orient="auto-start-reverse">
      <path d="M6,0 L0,3 L6,6 Z" fill="#fcd34d"/>
    </marker>
    <!-- Corner handle symbol: two concentric circles -->
    <symbol id="corner-handle" overflow="visible">
      <!-- Outer mounting ring -->
      <circle class="hdw" cx="0" cy="0" r="26"/>
      <!-- Bolt ring -->
      <circle class="bolt" cx="0" cy="0" r="19"/>
      <!-- Inner recess / foot pad -->
      <circle fill="#0a0f1a" stroke="#334155" stroke-width="0.5" cx="0" cy="0" r="11"/>
      <!-- Cross-hair bolt detail -->
      <line x1="-19" y1="0" x2="19" y2="0" stroke="#475569" stroke-width="0.5"/>
      <line x1="0" y1="-19" x2="0" y2="19" stroke="#475569" stroke-width="0.5"/>
    </symbol>
  </defs>

  <!-- ── Background ──────────────────────────────────────────────────── -->
  <rect width="650" height="480" fill="#0d1117"/>

  <!-- ── Enclosure body ──────────────────────────────────────────────── -->
  <!-- Body: x=55..595 (540px wide) = 636mm @ 0.849 px/mm                -->
  <!--       y=38..416 (378px tall) = 454mm @ 0.832 px/mm                -->
  <rect class="body" x="55" y="38" width="540" height="378" rx="6"/>

  <!-- ── Top and bottom rail bands ─────────────────────────────────── -->
  <rect x="55" y="38" width="540" height="12" rx="6" fill="#243048" stroke="#475569" stroke-width="0.5"/>
  <rect x="55" y="404" width="540" height="12" rx="6" fill="#243048" stroke="#475569" stroke-width="0.5"/>

  <!-- ── Left edge flange detail ────────────────────────────────────── -->
  <rect x="55" y="55" width="9" height="264" fill="#131d2e" stroke="#334155" stroke-width="0.5"/>
  <circle class="bolt" cx="59" cy="75" r="3"/>
  <circle class="bolt" cx="59" cy="145" r="3"/>
  <circle class="bolt" cx="59" cy="215" r="3"/>
  <circle class="bolt" cx="59" cy="285" r="3"/>
  <circle class="bolt" cx="59" cy="345" r="3"/>

  <!-- ── Four corner handles / feet ─────────────────────────────────── -->
  <!-- Positioned ~32mm inset from each corner edge                      -->
  <!-- px inset = 32 * 0.849 ≈ 27px                                      -->
  <!-- Top-left corner handle -->
  <use href="#corner-handle" x="82" y="65"/>
  <!-- Top-right corner handle -->
  <use href="#corner-handle" x="568" y="65"/>
  <!-- Bottom-left corner handle -->
  <use href="#corner-handle" x="82" y="389"/>
  <!-- Bottom-right corner handle -->
  <use href="#corner-handle" x="568" y="389"/>

  <!-- ── Right edge flange detail (mirror of left) ────────────────── -->
  <rect x="586" y="55" width="9" height="264" fill="#131d2e" stroke="#334155" stroke-width="0.5"/>
  <circle class="bolt" cx="591" cy="75" r="3"/>
  <circle class="bolt" cx="591" cy="145" r="3"/>
  <circle class="bolt" cx="591" cy="215" r="3"/>
  <circle class="bolt" cx="591" cy="285" r="3"/>
  <circle class="bolt" cx="591" cy="345" r="3"/>

  <!-- ── Centre panel detail (subtle vertical and horizontal lines) ── -->
  <line x1="325" y1="50" x2="325" y2="404" stroke="#243048" stroke-width="0.75"/>
  <line x1="64" y1="227" x2="586" y2="227" stroke="#243048" stroke-width="0.5"/>

  <!-- ── Recessed port area (right side panel opening) ─────────────── -->
  <!-- Venu 215 V2 has port on front only; side shows vent slot at base  -->
  <rect x="160" y="390" width="280" height="8" rx="2"
        fill="#0a0f1a" stroke="#334155" stroke-width="0.5"/>
  <!-- Foot rubber pad indicators (bottom of cabinet) -->
  <rect x="90" y="408" width="40" height="6" rx="2" fill="#111827" stroke="#334155" stroke-width="0.5"/>
  <rect x="520" y="408" width="40" height="6" rx="2" fill="#111827" stroke="#334155" stroke-width="0.5"/>

  <!-- ── Dimension lines ───────────────────────────────────────────── -->
  <!-- Width arrow — horizontal, below enclosure -->
  <line class="dln" x1="55" y1="435" x2="595" y2="435"
        marker-start="url(#arr-s-rev)" marker-end="url(#arr-s)"/>
  <line class="dln" x1="55" y1="426" x2="55" y2="444"/>
  <line class="dln" x1="595" y1="426" x2="595" y2="444"/>
  <text class="dim" x="325" y="451">636 mm  (25.0″)</text>

  <!-- Height arrow — vertical, right of enclosure -->
  <line class="dln" x1="614" y1="38" x2="614" y2="416"
        marker-start="url(#arr-s-rev)" marker-end="url(#arr-s)"/>
  <line class="dln" x1="606" y1="38" x2="622" y2="38"/>
  <line class="dln" x1="606" y1="416" x2="622" y2="416"/>
  <text class="dim-r" x="633" y="227" transform="rotate(90,633,227)">454 mm  (17.9″)</text>

  <!-- ── CORNER HANDLE call-out ─────────────────────────────────────── -->
  <line class="callout-line" x1="107" y1="53" x2="180" y2="24"/>
  <text class="callout" x="182" y="22">CORNER HANDLE / FOOT (×4)</text>

  <!-- ── Labels ─────────────────────────────────────────────────────── -->
  <text class="lbl" x="325" y="473">VOID VENU 215 V2</text>
  <text class="sub" x="325" y="14">DJ Booth Subwoofer · 2× 15″ LF · Side Elevation</text>

</svg>
