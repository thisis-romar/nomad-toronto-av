<?xml version="1.0" encoding="UTF-8"?>
<!--
  Speaker: VOID Venu 215 V2 — front elevation
  Source PNG: 05-speaker-assets/png/void-venu-215-v2-dims.png
  Actual dimensions: W 860mm × H 446mm × D 636mm
  Driver(s): 2× 15″ (381mm) LF subwoofer
  Port: single circular port, lock-stud hardware
  Drawn: 2026-04-28
  Methodology: 06-reference-docs/svg-drawing-methodology.md
-->
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 800 450" width="800" height="450"
     role="img"
     aria-labelledby="venu215-front-title venu215-front-desc">

  <title id="venu215-front-title">VOID Venu 215 V2 — Front Elevation</title>
  <desc id="venu215-front-desc">Technical line drawing of the VOID Venu 215 V2 front view.
    Dimensions: W 860mm × H 446mm × D 636mm. DJ booth subwoofer.
    Source: void-venu-215-v2-dims.png.</desc>

  <defs>
    <style>
      text { font-family: 'Segoe UI', Arial, sans-serif; }
      .lbl  { fill: #f0f6fc; font-size: 13px; font-weight: 700; text-anchor: middle; }
      .sub  { fill: #8b949e; font-size: 9px; text-anchor: middle; }
      .dim  { fill: #fcd34d; font-size: 9px; font-family: 'Segoe UI Mono', monospace; text-anchor: middle; }
      .dim-r { fill: #fcd34d; font-size: 9px; font-family: 'Segoe UI Mono', monospace; text-anchor: middle; dominant-baseline: central; }
      .dln  { stroke: #4b5563; stroke-width: 0.75; fill: none; }
      .body { fill: #1e293b; stroke: #475569; stroke-width: 1.5; }
      .port { fill: #0a0f1a; stroke: #334155; stroke-width: 1; }
      .hdw  { fill: #0f172a; stroke: #475569; stroke-width: 1; }
      .callout { fill: #fcd34d; font-size: 8px; font-family: 'Segoe UI Mono', monospace; text-anchor: start; }
      .callout-line { stroke: #fcd34d; stroke-width: 0.5; fill: none; }
    </style>
    <!-- Arrowhead markers for dimension lines -->
    <marker id="arr-f" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#fcd34d"/>
    </marker>
    <marker id="arr-f-rev" markerWidth="6" markerHeight="6" refX="1" refY="3" orient="auto-start-reverse">
      <path d="M6,0 L0,3 L6,6 Z" fill="#fcd34d"/>
    </marker>
  </defs>

  <!-- ── Background ──────────────────────────────────────────────────── -->
  <rect width="800" height="450" fill="#0d1117"/>

  <!-- ── Enclosure body ──────────────────────────────────────────────── -->
  <!-- Canvas 800×450; body fills x=55..745 (690px wide), y=40..390 (350px tall)  -->
  <!-- Scale: 690/860 ≈ 0.802 px/mm; 350/446 ≈ 0.785 px/mm                       -->
  <rect class="body" x="55" y="40" width="690" height="350" rx="6"/>

  <!-- ── Top and bottom rail detail (slightly lighter band) ──────────── -->
  <rect x="55" y="40" width="690" height="14" rx="6" fill="#243048" stroke="#475569" stroke-width="0.5"/>
  <rect x="55" y="376" width="690" height="14" rx="6" fill="#243048" stroke="#475569" stroke-width="0.5"/>

  <!-- ── Circular port (left-centre of front panel) ─────────────────── -->
  <!-- Port visible as a dark circular cutout, ~60mm diameter → ~48px radius -->
  <circle class="port" cx="145" cy="215" r="38"/>
  <!-- Port inner ring (lock stud detail) -->
  <circle class="hdw" cx="145" cy="215" r="32"/>
  <circle class="port" cx="145" cy="215" r="22"/>
  <!-- Lock stud cross-hair marks -->
  <line x1="107" y1="215" x2="183" y2="215" stroke="#475569" stroke-width="0.75"/>
  <line x1="145" y1="177" x2="145" y2="253" stroke="#475569" stroke-width="0.75"/>

  <!-- ── Corner hardware studs (4 corners) ─────────────────────────── -->
  <!-- Top-left -->
  <circle class="hdw" cx="72" cy="57" r="7"/>
  <circle fill="#0d1117" cx="72" cy="57" r="3"/>
  <!-- Top-right -->
  <circle class="hdw" cx="728" cy="57" r="7"/>
  <circle fill="#0d1117" cx="728" cy="57" r="3"/>
  <!-- Bottom-left -->
  <circle class="hdw" cx="72" cy="373" r="7"/>
  <circle fill="#0d1117" cx="72" cy="373" r="3"/>
  <!-- Bottom-right -->
  <circle class="hdw" cx="728" cy="373" r="7"/>
  <circle fill="#0d1117" cx="728" cy="373" r="3"/>

  <!-- ── Side flange detail (left edge) ─────────────────────────────── -->
  <rect x="55" y="55" width="10" height="280" fill="#131d2e" stroke="#334155" stroke-width="0.5"/>
  <!-- Side flange bolts -->
  <circle fill="#1e293b" stroke="#475569" stroke-width="0.75" cx="60" cy="80" r="4"/>
  <circle fill="#1e293b" stroke="#475569" stroke-width="0.75" cx="60" cy="145" r="4"/>
  <circle fill="#1e293b" stroke="#475569" stroke-width="0.75" cx="60" cy="215" r="4"/>
  <circle fill="#1e293b" stroke="#475569" stroke-width="0.75" cx="60" cy="285" r="4"/>
  <circle fill="#1e293b" stroke="#475569" stroke-width="0.75" cx="60" cy="350" r="4"/>

  <!-- ── Right edge flange detail (mirror of left) ────────────────── -->
  <rect x="735" y="55" width="10" height="280" fill="#131d2e" stroke="#334155" stroke-width="0.5"/>
  <circle fill="#1e293b" stroke="#475569" stroke-width="0.75" cx="740" cy="80" r="4"/>
  <circle fill="#1e293b" stroke="#475569" stroke-width="0.75" cx="740" cy="145" r="4"/>
  <circle fill="#1e293b" stroke="#475569" stroke-width="0.75" cx="740" cy="215" r="4"/>
  <circle fill="#1e293b" stroke="#475569" stroke-width="0.75" cx="740" cy="285" r="4"/>
  <circle fill="#1e293b" stroke="#475569" stroke-width="0.75" cx="740" cy="350" r="4"/>

  <!-- ── Subtle centre panel seam ──────────────────────────────────── -->
  <line x1="55" y1="215" x2="745" y2="215" stroke="#243048" stroke-width="0.5"/>

  <!-- ── PORT call-out ───────────────────────────────────────────────── -->
  <line class="callout-line" x1="175" y1="194" x2="220" y2="170"/>
  <text class="callout" x="222" y="168">PORT</text>

  <!-- ── Dimension line — width (860mm) below enclosure ─────────────── -->
  <line class="dln" x1="55" y1="405" x2="745" y2="405"
        marker-start="url(#arr-f-rev)" marker-end="url(#arr-f)"/>
  <!-- Tick marks at ends -->
  <line class="dln" x1="55" y1="397" x2="55" y2="413"/>
  <line class="dln" x1="745" y1="397" x2="745" y2="413"/>
  <text class="dim" x="400" y="420">860 mm  (33.9″)</text>

  <!-- ── Dimension line — height (446mm) right of enclosure ─────────── -->
  <line class="dln" x1="760" y1="40" x2="760" y2="390"
        marker-start="url(#arr-f-rev)" marker-end="url(#arr-f)"/>
  <!-- Tick marks -->
  <line class="dln" x1="752" y1="40" x2="768" y2="40"/>
  <line class="dln" x1="752" y1="390" x2="768" y2="390"/>
  <text class="dim-r" x="781" y="215" transform="rotate(90,781,215)">446 mm  (17.6″)</text>

  <!-- ── Labels ─────────────────────────────────────────────────────── -->
  <text class="lbl" x="400" y="443">VOID VENU 215 V2</text>
  <text class="sub" x="400" y="14">DJ Booth Subwoofer · 2× 15″ LF · Front Elevation</text>

</svg>
