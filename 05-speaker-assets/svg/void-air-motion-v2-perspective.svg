<?xml version="1.0" encoding="UTF-8"?>
<!--
  Speaker: VOID Air Motion V2 — top
  Source PNG: 05-speaker-assets/png/void-air-motion-v2-top.png
  Actual dimensions: W 854mm × D 672mm
  Driver(s): 2× 457mm (18″) LF, 300mm (12″) mid, horn HF
  Drawn: 2026-04-28
  Methodology: 06-reference-docs/svg-drawing-methodology.md
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 295" width="800" height="295" role="img">

<title>VOID Air Motion V2 - 3D Perspective</title>
<desc id="amtop-desc">Perspective (above-front) and orthographic top-down plan views.
  Dimensions: W 854mm × D 672mm. Two 18″ cardioid woofers, 12″ mid, horn HF.
  Source: 05-speaker-assets/png/void-air-motion-v2-top.png.</desc>

<defs>
  <style>
    text { font-family: 'Segoe UI', Arial, sans-serif; }
    .hdr  { fill: #f0f6fc; font-size: 13px; font-weight: 700; text-anchor: middle; }
    .lbl  { fill: #f0f6fc; font-size: 11px; font-weight: 600; text-anchor: middle; }
    .sub  { fill: #8b949e; font-size: 9px;  text-anchor: middle; }
    .dim  { fill: #fcd34d; font-size: 9px;  font-family: 'Segoe UI Mono', monospace; text-anchor: middle; }
    .dln  { stroke: #4b5563; stroke-width: 0.5; fill: none; }
    .body { fill: #1e293b; stroke: #475569; stroke-width: 1.5; }
    .drv  { fill: #111827; stroke: #334155; stroke-width: 1; }
    .sur  { fill: none;    stroke: #334155; stroke-width: 0.75; }
    .horn { fill: #0f172a; stroke: #475569; stroke-width: 1; }
    .mot  { fill: #0a0f1a; stroke: #334155; stroke-width: 0.75; }
    .sep  { stroke: #1e293b; stroke-width: 1; }
  </style>

  <!-- Arrowhead markers for dimension lines -->
  <marker id="arr" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
    <path d="M0,0 L6,3 L0,6 Z" fill="#fcd34d"/>
  </marker>
  <marker id="arr-rev" markerWidth="6" markerHeight="6" refX="1" refY="3"
          orient="auto-start-reverse">
    <path d="M6,0 L0,3 L6,6 Z" fill="#fcd34d"/>
  </marker>
</defs>

<!-- ── Background ─────────────────────────────────────────────────── -->
<rect width="800" height="600" fill="#0d1117"/>

<!-- ── Header ─────────────────────────────────────────────────────── -->
<text x="400" y="18" class="hdr">VOID AIR MOTION V2 — TOP VIEW</text>
<text x="400" y="30" class="sub">Perspective (above) · Orthographic plan · Dimensions: mm (inches)</text>
<line x1="60" y1="36" x2="740" y2="36" stroke="#1e293b" stroke-width="1"/>

<!-- ═══════════════════════════════════════════════════════════════════
     VIEW 1 — 3D PERSPECTIVE (above-front render)
     Canvas region: x 80–720, y 45–285
     Shows the bowl-shaped woofer mouths, horn and motor block
     ═══════════════════════════════════════════════════════════════════ -->
<text x="400" y="52" class="lbl">3D PERSPECTIVE — ABOVE FRONT</text>

<!-- Enclosure shadow / base ellipse suggesting cabinet depth -->
<ellipse cx="400" cy="230" rx="285" ry="50" fill="#111827" stroke="none" opacity="0.6"/>

<!-- ── LEFT woofer bowl (18") — large open cone mouth facing viewer ── -->
<!-- Outer rim ellipse -->
<ellipse cx="265" cy="180" rx="155" ry="90" class="body"/>
<!-- Inner cone surround ring -->
<ellipse cx="265" cy="178" rx="125" ry="72" class="sur"/>
<!-- Cone mid ring -->
<ellipse cx="265" cy="176" rx="90"  ry="52" class="drv"/>
<!-- Dust cap / centre -->
<ellipse cx="265" cy="174" rx="40"  ry="23" class="mot"/>
<!-- Spider / motor suggestion -->
<ellipse cx="265" cy="173" rx="18"  ry="11" fill="#0d1117" stroke="#475569" stroke-width="0.75"/>

<!-- ── RIGHT woofer bowl (18") ──────────────────────────────────────── -->
<ellipse cx="540" cy="180" rx="155" ry="90" class="body"/>
<ellipse cx="540" cy="178" rx="125" ry="72" class="sur"/>
<ellipse cx="540" cy="176" rx="90"  ry="52" class="drv"/>
<ellipse cx="540" cy="174" rx="40"  ry="23" class="mot"/>
<ellipse cx="540" cy="173" rx="18"  ry="11" fill="#0d1117" stroke="#475569" stroke-width="0.75"/>

<!-- ── Centre motor block + horn waveguide (top-centre, recessed) ─── -->
<!-- Horn mouth — rectangular waveguide cross-section in perspective -->
<rect class="horn" x="352" y="96" width="96" height="54" rx="4"/>
<!-- Horn inner throat ellipse -->
<ellipse cx="400" cy="123" rx="30" ry="16" class="mot"/>
<!-- Motor block body below horn -->
<rect class="body" x="368" y="150" width="64" height="42" rx="2"/>
<!-- Mid driver circle in motor block -->
<circle class="drv" cx="400" cy="171" r="24"/>
<circle class="mot" cx="400" cy="171" r="12"/>
<!-- Strut lines connecting woofer rims to centre block -->
<line x1="390" y1="150" x2="355" y2="175" stroke="#334155" stroke-width="0.75" fill="none"/>
<line x1="410" y1="150" x2="445" y2="175" stroke="#334155" stroke-width="0.75" fill="none"/>

<!-- ── Divider ────────────────────────────────────────────────────── -->
<line x1="60" y1="292" x2="740" y2="292" stroke="#1e293b" stroke-width="1"/>

<!-- ═══════════════════════════════════════════════════════════════════
     VIEW 2 — ORTHOGRAPHIC TOP-DOWN PLAN
     Canvas region: x 80–720, y 300–560
     Scale: 854mm → 570px → 0.668 px/mm (fits with 40px side margins)
     ═══════════════════════════════════════════════════════════════════ -->
<text x="400" y="308" class="lbl">TOP-DOWN PLAN</text>

<!-- Plan enclosure outline — 854mm wide × 672mm deep
     At 0.668 px/mm: 854 → 570px wide, 672 → 449px deep
     Centred: x0 = 400 - 285 = 115, y0 = 315 -->
<rect class="body" x="115" y="316" width="570" height="225" rx="2"/>

<!-- ── LEFT woofer plan circles
     Centre at ~x 265 (=115 + 150), y 428 (=316 + 112)
     18" woofer = 457mm diameter → 457×0.668 = 305px diameter → r=152
     Cabinet depth 225px, woofer r 108 → place at y=316+108=424 -->
<!-- Woofer outer surround -->
<circle class="drv" cx="260" cy="428" r="108"/>
<!-- Surround ring -->
<circle class="sur" cx="260" cy="428" r="86"/>
<!-- Cone ring -->
<circle class="drv" cx="260" cy="428" r="60"/>
<!-- Dust cap -->
<circle class="mot" cx="260" cy="428" r="26"/>
<!-- Centre cap -->
<circle cx="260" cy="428" r="12" fill="#0d1117" stroke="#475569" stroke-width="0.75"/>

<!-- ── RIGHT woofer plan circles
     Centre at x 540 (=115 + 420), same y -->
<circle class="drv" cx="540" cy="428" r="108"/>
<circle class="sur" cx="540" cy="428" r="86"/>
<circle class="drv" cx="540" cy="428" r="60"/>
<circle class="mot" cx="540" cy="428" r="26"/>
<circle cx="540" cy="428" r="12" fill="#0d1117" stroke="#475569" stroke-width="0.75"/>

<!-- ── Horn waveguide plan (top-front, top-centre of enclosure)
     Horn cross-section: rectangular, centred, at front of cabinet y≈330 -->
<rect class="horn" x="349" y="322" width="102" height="46" rx="4"/>
<ellipse cx="400" cy="345" rx="28" ry="13" class="mot"/>

<!-- ── Mid driver plan (between the two woofers, centre of cabinet) -->
<!-- 300mm mid = 300×0.668 = 200px diameter → r=100; but too big; scale r=52 -->
<circle class="drv" cx="400" cy="428" r="52"/>
<circle class="sur" cx="400" cy="428" r="40"/>
<circle class="mot" cx="400" cy="428" r="20"/>
<circle cx="400" cy="428" r="8" fill="#0d1117" stroke="#475569" stroke-width="0.75"/>

<!-- ── Dividing line between woofers (cabinet internal baffle suggestion) -->
<line x1="115" y1="428" x2="685" y2="428" stroke="#334155" stroke-width="0.5" stroke-dasharray="4 3"/>

<!-- ── DIMENSION LINES ────────────────────────────────────────────── -->

<!-- Width: 854mm (33.6") — horizontal arrow above plan enclosure -->
<line class="dln" x1="115" y1="308" x2="115" y2="316"
      stroke="#4b5563" stroke-width="0.5"/>
<line class="dln" x1="685" y1="308" x2="685" y2="316"
      stroke="#4b5563" stroke-width="0.5"/>
<line x1="120" y1="311" x2="680" y2="311"
      stroke="#fcd34d" stroke-width="0.75"
      marker-start="url(#arr-rev)" marker-end="url(#arr)"/>
<text x="400" y="307" class="dim">854mm (33.6″)</text>

<!-- Depth: 672mm (26.5") — vertical arrow left of plan enclosure -->
<line class="dln" x1="107" y1="316" x2="115" y2="316"
      stroke="#4b5563" stroke-width="0.5"/>
<line class="dln" x1="107" y1="541" x2="115" y2="541"
      stroke="#4b5563" stroke-width="0.5"/>
<line x1="111" y1="321" x2="111" y2="536"
      stroke="#fcd34d" stroke-width="0.75"
      marker-start="url(#arr-rev)" marker-end="url(#arr)"/>
<text x="92" y="430" class="dim" transform="rotate(-90,92,430)">672mm (26.5″)</text>

<!-- ── Component labels ───────────────────────────────────────────── -->
<text x="260" y="543" class="sub">18″ WOOFER (L)</text>
<text x="540" y="543" class="sub">18″ WOOFER (R)</text>
<text x="400" y="555" class="sub">12″ MID · HORN HF (centre)</text>

<!-- ── Footer label ───────────────────────────────────────────────── -->
<line x1="60" y1="568" x2="740" y2="568" stroke="#1e293b" stroke-width="1"/>
<text x="400" y="580" class="sub">VOID AIR MOTION V2 · Three-Way Cardioid Subwoofer Array · 2× 18″ LF · 12″ Mid · Horn HF</text>
<text x="400" y="591" class="sub">Nomad Toronto / Emblem Projects Inc. · Source: VOID Acoustics product documentation</text>

</svg>
