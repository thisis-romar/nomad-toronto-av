<?xml version="1.0" encoding="UTF-8"?>
<!--
  Speaker: VOID Air Vantage — top-down view
  Source PNG: 05-speaker-assets/png/void-air-vantage-top.png
              05-speaker-assets/png/void-air-vantage-dims.png
  Actual dimensions (top plan):
    Total horn spread width: 719 mm [28.3 in]
    Horn throat width:       108 mm [4.3 in]
    Left horn arm:           305 mm [12.0 in]
    Rear cabinet depth:      276 mm [10.9 in]
    Mounting bracket height:  51 mm [2.0 in]
  Profile: Wide-dispersion horn-loaded DJ monitor, top-down plan view.
    Horn flares outward from a narrow throat (rear cabinet top) to a
    very wide 719mm mouth opening. Driver/bracket assembly visible at
    throat. Two rectangular port/vent slots on rear of cabinet. Woofer
    cone visible through horn opening from directly above.
  Drawn: 2026-04-28
  Methodology: 06-reference-docs/svg-drawing-methodology.md
-->
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 700 500" width="700" height="500"
     role="img"
     aria-labelledby="avt-title avt-desc">

  <title id="avt-title">VOID Air Vantage — Top-Down Plan</title>
  <desc id="avt-desc">Technical top-down plan drawing of the VOID Air Vantage horn-loaded
    DJ monitor. Horn spread: 719 mm [28.3 in] wide. Rear cabinet depth: 276 mm [10.9 in].
    Horn throat: 108 mm [4.3 in]. Source: void-air-vantage-dims.png.</desc>

  <defs>
    <style>
      text { font-family: 'Segoe UI', Arial, sans-serif; }
      .lbl  { fill: #f0f6fc; font-size: 13px; font-weight: 700; text-anchor: middle; }
      .sub  { fill: #8b949e; font-size: 9px; text-anchor: middle; }
      .dim  { fill: #fcd34d; font-size: 9px; font-family: 'Segoe UI Mono', monospace; text-anchor: middle; }
      .dln  { stroke: #4b5563; stroke-width: 0.5; fill: none; }
      .body { fill: #1e293b; stroke: #475569; stroke-width: 1.5; }
      .detail { fill: none; stroke: #334155; stroke-width: 0.8; stroke-dasharray: 4,3; }
      .drv  { fill: #111827; stroke: #334155; stroke-width: 1; }
      .port { fill: #0a0f1a; stroke: #334155; stroke-width: 0.8; }
      .mount { fill: #111827; stroke: #475569; stroke-width: 1; }
      .brkt { fill: #161f2e; stroke: #475569; stroke-width: 1; }
    </style>
    <!-- Arrowheads for dimension lines -->
    <marker id="arr" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#fcd34d"/>
    </marker>
    <marker id="arr-rev" markerWidth="6" markerHeight="6" refX="1" refY="3"
            orient="auto-start-reverse">
      <path d="M6,0 L0,3 L6,6 Z" fill="#fcd34d"/>
    </marker>
  </defs>

  <!-- ── Background ─────────────────────────────────────────────────── -->
  <rect width="700" height="500" fill="#0d1117"/>

  <!-- ── Title header ───────────────────────────────────────────────── -->
  <text x="350" y="22" class="lbl">VOID AIR VANTAGE — TOP-DOWN PLAN</text>
  <text x="350" y="34" class="sub">Horn Spread: 719 mm [28.3 in] · Rear Cab Depth: 276 mm [10.9 in] · Throat: 108 mm [4.3 in]</text>
  <line x1="40" y1="40" x2="660" y2="40" stroke="#1e293b" stroke-width="1"/>

  <!-- ══════════════════════════════════════════════════════════════════
       TOP-DOWN PLAN VIEW
       Canvas region: x 40–660, y 55–420
       Scale: 719mm → 560px = 0.779 px/mm
              276mm → 215px = 0.779 px/mm

       Horn mouth (front top of plan):   y=80,  x=70..630
       Horn throat centre:               x=350
       Horn throat edges:                x=308 and x=392  (84px = 108mm)
       Rear cabinet front edge (throat): y=290
       Rear cabinet back edge:           y=290+215=505 → clamp to y=385
       (276mm * 0.779 = 215px, but cabinet condensed to 95px for canvas fit)
       Actual cabinet y: 290–385
       Horn arm bottom at y=385
       ══════════════════════════════════════════════════════════════════ -->

  <!-- ── Horn flare — left wing ─────────────────────────────────────── -->
  <!-- Left arm: mouth-left (70,80) → throat-left (308,290) → cabinet-left-bottom (200,385) → mouth-left-bottom -->
  <polygon class="body"
    points="70,80 308,290 200,385 70,80"/>
  <!-- Left arm inner acoustic guide (dashed) -->
  <path class="detail" d="M 110,80 Q 210,185 308,310"/>

  <!-- ── Horn flare — right wing ────────────────────────────────────── -->
  <!-- Right arm: mouth-right (630,80) → throat-right (392,290) → cabinet-right-bottom (500,385) -->
  <polygon class="body"
    points="630,80 392,290 500,385 630,80"/>
  <!-- Right arm inner acoustic guide (dashed) -->
  <path class="detail" d="M 590,80 Q 490,185 392,310"/>

  <!-- ── Horn mouth front edge ──────────────────────────────────────── -->
  <rect class="body" x="70" y="72" width="560" height="12" rx="1"/>

  <!-- ── Rear cabinet box ───────────────────────────────────────────── -->
  <rect class="body" x="308" y="290" width="84" height="95" rx="2"/>

  <!-- ── Bottom cap across horn arm bases ──────────────────────────── -->
  <rect class="body" x="200" y="378" width="300" height="12" rx="1"/>

  <!-- ── Driver/bracket assembly at throat ─────────────────────────── -->
  <!-- Mounting bracket (rectangular, visible from above) -->
  <rect class="brkt" x="323" y="244" width="54" height="50" rx="2"/>
  <!-- Bracket bolt holes (4 corners) -->
  <circle class="mount" cx="330" cy="251" r="3.5"/>
  <circle class="mount" cx="370" cy="251" r="3.5"/>
  <circle class="mount" cx="330" cy="287" r="3.5"/>
  <circle class="mount" cx="370" cy="287" r="3.5"/>
  <!-- Woofer cone visible from above (ellipse, foreshortened) -->
  <ellipse class="drv" cx="350" cy="267" rx="22" ry="16"/>
  <!-- Inner cone ring -->
  <ellipse fill="none" stroke="#334155" stroke-width="0.5" cx="350" cy="267" rx="13" ry="9"/>
  <!-- Dust cap -->
  <circle class="mount" cx="350" cy="267" r="4"/>

  <!-- ── Port vents on rear of cabinet ─────────────────────────────── -->
  <rect class="port" x="321" y="374" width="18" height="7" rx="1"/>
  <rect class="port" x="361" y="374" width="18" height="7" rx="1"/>

  <!-- ── Rigging/pole-mount point ───────────────────────────────────── -->
  <circle class="mount" cx="350" cy="350" r="7"/>
  <circle fill="none" stroke="#475569" stroke-width="0.5" cx="350" cy="350" r="3.5"/>

  <!-- ══════════════════════════════════════════════════════════════════
       DIMENSION LINES
       ══════════════════════════════════════════════════════════════════ -->

  <!-- Total horn spread width — horizontal, above horn mouth -->
  <line class="dln" x1="70" y1="57" x2="630" y2="57"/>
  <line class="dln" x1="70" y1="72" x2="70" y2="50"/>
  <line class="dln" x1="630" y1="72" x2="630" y2="50"/>
  <line class="dln" marker-start="url(#arr-rev)" marker-end="url(#arr)"
        x1="75" y1="57" x2="625" y2="57"/>
  <text class="dim" x="350" y="52">719 mm [28.3 in]</text>

  <!-- Left horn arm span — horizontal at y=98 -->
  <line class="dln" x1="70" y1="98" x2="308" y2="98"/>
  <line class="dln" marker-start="url(#arr-rev)" marker-end="url(#arr)"
        x1="73" y1="98" x2="305" y2="98"/>
  <text class="dim" x="190" y="112">305 mm [12.0 in]</text>

  <!-- Throat width — horizontal, at y=308 -->
  <line class="dln" x1="308" y1="308" x2="392" y2="308"/>
  <line class="dln" marker-start="url(#arr-rev)" marker-end="url(#arr)"
        x1="311" y1="308" x2="389" y2="308"/>
  <text class="dim" x="350" y="322">108 mm [4.3 in]</text>

  <!-- Rear cabinet depth — vertical, right side -->
  <line class="dln" x1="415" y1="290" x2="415" y2="385"/>
  <line class="dln" x1="392" y1="290" x2="422" y2="290"/>
  <line class="dln" x1="392" y1="385" x2="422" y2="385"/>
  <line class="dln" marker-start="url(#arr-rev)" marker-end="url(#arr)"
        x1="415" y1="295" x2="415" y2="380"/>
  <text class="dim" x="449" y="336">276 mm</text>
  <text class="dim" x="449" y="347">[10.9 in]</text>

  <!-- Bracket depth (51mm) — vertical, right of bracket -->
  <line class="dln" x1="448" y1="244" x2="448" y2="290"/>
  <line class="dln" x1="377" y1="244" x2="455" y2="244"/>
  <line class="dln" x1="392" y1="290" x2="455" y2="290"/>
  <line class="dln" marker-start="url(#arr-rev)" marker-end="url(#arr)"
        x1="448" y1="248" x2="448" y2="286"/>
  <text class="dim" x="475" y="265">51 mm</text>
  <text class="dim" x="475" y="276">[2.0 in]</text>

  <!-- ── Callout labels ─────────────────────────────────────────────── -->
  <text class="sub" x="350" y="91" text-anchor="middle">HORN MOUTH (FRONT)</text>
  <text class="sub" x="160" y="210" text-anchor="middle">LEFT HORN ARM</text>
  <text class="sub" x="540" y="210" text-anchor="middle">RIGHT HORN ARM</text>
  <text class="sub" x="350" y="273" text-anchor="middle">WOOFER</text>
  <text class="sub" x="350" y="395" text-anchor="middle">REAR CABINET (BACK EDGE)</text>

  <!-- ── Footer labels ──────────────────────────────────────────────── -->
  <text x="350" y="430" class="lbl" font-size="11">VOID AIR VANTAGE</text>
  <text x="350" y="443" class="sub">Horn-Loaded DJ / Stage Monitor · Top-Down Plan View</text>
  <text x="350" y="455" class="sub">Nomad Toronto · Emblem Projects Inc. · 2026-04-28</text>

</svg>
