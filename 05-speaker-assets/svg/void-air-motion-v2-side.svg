<?xml version="1.0" encoding="UTF-8"?>
<!--
  Speaker: VOID Air Motion V2 — side
  Source PNG: 05-speaker-assets/png/void-air-motion-v2-side.png
  Actual dimensions: D 658mm (25.9")
  Driver(s): dual 18" LF subwoofers + 300mm mid + horn-loaded HF compression driver
  Drawn: 2026-04-28
  Methodology: 06-reference-docs/svg-drawing-methodology.md
-->
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 600 500" width="600" height="500"
     role="img"
     aria-labelledby="amv2-side-title amv2-side-desc">

  <title id="amv2-side-title">VOID Air Motion V2 — Side Elevation</title>
  <desc id="amv2-side-desc">Technical line drawing of the VOID Air Motion V2 side elevation.
    Depth: 658mm (25.9"). The large horn mouth opens to the left; the motor/driver
    block and rear yoke bracket sit on the right. Source: void-air-motion-v2-side.png.</desc>

  <defs>
    <style>
      text { font-family: 'Segoe UI', Arial, sans-serif; }
      .lbl  { fill: #f0f6fc; font-size: 12px; font-weight: 700; text-anchor: middle; }
      .sub  { fill: #8b949e; font-size: 9px; text-anchor: middle; }
      .dim  { fill: #fcd34d; font-size: 9px; font-family: 'Segoe UI Mono', monospace; text-anchor: middle; }
      .dln  { stroke: #4b5563; stroke-width: 0.5; fill: none; }
      .body { fill: #1e293b; stroke: #475569; stroke-width: 1.5; }
      .drv  { fill: #111827; stroke: #334155; stroke-width: 1; }
      .port { fill: #0a0f1a; stroke: #334155; stroke-width: 0.5; }
    </style>

    <!-- Arrowhead markers (same IDs as front SVG) -->
    <marker id="arr" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#fcd34d"/>
    </marker>
    <marker id="arr-rev" markerWidth="6" markerHeight="6" refX="1" refY="3"
            orient="auto-start-reverse">
      <path d="M6,0 L0,3 L6,6 Z" fill="#fcd34d"/>
    </marker>
  </defs>

  <!-- ── Background ─────────────────────────────────────────────────────── -->
  <rect width="600" height="500" fill="#0d1117"/>

  <!-- ── Title header ───────────────────────────────────────────────────── -->
  <text x="300" y="20" class="lbl">VOID AIR MOTION V2 — SIDE ELEVATION</text>
  <text x="300" y="34" class="sub">Source: VOID Acoustics product documentation · Depth: 658 mm (25.9″)</text>
  <line x1="40" y1="40" x2="560" y2="40" stroke="#1e293b" stroke-width="1"/>

  <!-- ══════════════════════════════════════════════════════════════════════
       SIDE ELEVATION
       The horn mouth is a large near-circular opening facing LEFT.
       The motor/throat block sits centre, linking to the rear bracket on the RIGHT.

       Canvas layout (y 55 – 435, x 55 – 545):
         Horn mouth rim:   x=65,  y span ≈ 90–410  (mouth diameter ~320px)
         Horn throat:      x=340, y span ≈ 175–325  (throat ~150px tall)
         Motor block:      x=340–400, centred y=250
         Rear yoke:        x=400–525, y span ≈ 195–305

       Depth scale: 658mm → 480px → 0.73 px/mm
       ══════════════════════════════════════════════════════════════════════ -->

  <!-- ── Horn mouth rim — large near-circular bowl shape ───────────────── -->
  <!-- The mouth is an ellipse-like curved front face of the horn.
       In the PNG it reads as a full circular rim with the horn body behind it.
       We draw it as a tall ellipse arc (front face visible as the rim). -->

  <!-- Horn body fill — the interior volume of the horn -->
  <!-- Upper horn wall: curves from throat (340,175) to mouth rim top (90,93) -->
  <!-- Lower horn wall: curves from throat (340,325) to mouth rim bottom (90,407) -->
  <path d="M 340,175
           C 290,160  200,120  90,93
           L 90,407
           C 200,380  290,340  340,325
           Z"
        fill="#1a2535" stroke="none"/>

  <!-- Horn mouth elliptical rim (the circular opening face) -->
  <!-- Drawn as a half-ellipse arc on the left, suggesting depth of the bowl -->
  <ellipse cx="90" cy="250" rx="22" ry="157"
           fill="#1e293b" stroke="#475569" stroke-width="1.5"/>

  <!-- Horn upper wall (outer edge) -->
  <path d="M 340,175  C 290,160  200,120  90,93"
        fill="none" stroke="#475569" stroke-width="1.5"/>

  <!-- Horn lower wall (outer edge) -->
  <path d="M 340,325  C 290,340  200,380  90,407"
        fill="none" stroke="#475569" stroke-width="1.5"/>

  <!-- Horn upper wall inner detail / secondary flare line -->
  <path d="M 340,195  C 295,183  215,152  120,132"
        fill="none" stroke="#334155" stroke-width="0.75" stroke-dasharray="4,3"/>

  <!-- Horn lower wall inner detail / secondary flare line -->
  <path d="M 340,305  C 295,317  215,348  120,368"
        fill="none" stroke="#334155" stroke-width="0.75" stroke-dasharray="4,3"/>

  <!-- Horn mouth top cap (horizontal line connecting upper wall to rim top) -->
  <line x1="90" y1="93" x2="90" y2="93"
        stroke="#475569" stroke-width="1.5"/>

  <!-- ── Throat flange / junction plate ────────────────────────────────── -->
  <!-- Vertical plate where horn throat meets the motor block assembly -->
  <rect x="335" y="168" width="12" height="164"
        fill="#1a2535" stroke="#475569" stroke-width="1"/>

  <!-- ── Motor / compression driver block ─────────────────────────────── -->
  <!-- Rectangular block containing HF compression driver + mid assembly -->
  <rect x="347" y="185" width="58" height="130"
        rx="3" fill="#1a2535" stroke="#475569" stroke-width="1.5"/>

  <!-- HF compression driver body (upper portion of block) -->
  <rect x="353" y="190" width="46" height="42"
        rx="2" fill="#253344" stroke="#64748b" stroke-width="1"/>

  <!-- Phase plug detail line -->
  <line x1="353" y1="208" x2="399" y2="208"
        stroke="#475569" stroke-width="0.75"/>

  <!-- Mid driver cone silhouette (lower block, trapezoidal side-view shape) -->
  <path d="M 353,237  L 365,250  L 365,295  L 353,305  Z"
        fill="#253344" stroke="#64748b" stroke-width="1"/>
  <path d="M 399,237  L 387,250  L 387,295  L 399,305  Z"
        fill="#253344" stroke="#64748b" stroke-width="1"/>

  <!-- Dust cap ellipse (mid driver centre) -->
  <ellipse cx="376" cy="272" rx="16" ry="6"
           fill="#1e293b" stroke="#64748b" stroke-width="1"/>

  <!-- Vertical centre-line of motor block -->
  <line x1="376" y1="188" x2="376" y2="313"
        stroke="#334155" stroke-width="0.75" stroke-dasharray="4,3"/>

  <!-- ── Rear mounting yoke / bracket ─────────────────────────────────── -->
  <!-- The yoke is the rectangular back-plate and side arms visible in the PNG
       on the right side. It connects the cabinet to the rigging hardware. -->

  <!-- Back panel plate -->
  <rect x="405" y="210" width="80" height="80"
        rx="2" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>

  <!-- Yoke upper arm -->
  <rect x="430" y="195" width="30" height="18"
        rx="2" fill="#1a2535" stroke="#475569" stroke-width="1"/>

  <!-- Yoke lower arm -->
  <rect x="430" y="287" width="30" height="18"
        rx="2" fill="#1a2535" stroke="#475569" stroke-width="1"/>

  <!-- Back panel horizontal centre detail line -->
  <line x1="407" y1="250" x2="483" y2="250"
        stroke="#334155" stroke-width="0.5"/>

  <!-- Rigging pin holes -->
  <circle cx="415" cy="222" r="5" fill="#0a0f1a" stroke="#475569" stroke-width="1"/>
  <circle cx="415" cy="278" r="5" fill="#0a0f1a" stroke="#475569" stroke-width="1"/>

  <!-- ── Rear secondary horn mouth (smaller, facing right) ─────────────── -->
  <!-- In the PNG a smaller secondary horn/port opening faces rearward.
       Shown as a narrow ellipse on the right face of the yoke plate. -->
  <ellipse cx="485" cy="250" rx="10" ry="35"
           fill="#1a2535" stroke="#64748b" stroke-width="1"/>

  <!-- Small secondary horn walls -->
  <path d="M 485,215  C 500,212  520,210  535,208"
        fill="none" stroke="#475569" stroke-width="1"/>
  <path d="M 485,285  C 500,288  520,290  535,292"
        fill="none" stroke="#475569" stroke-width="1"/>
  <line x1="535" y1="208" x2="535" y2="292"
        stroke="#475569" stroke-width="1.5"/>

  <!-- ══ DIMENSION ANNOTATIONS ══════════════════════════════════════════ -->

  <!-- Depth 658mm (25.9") — horizontal, below cabinet ─────────────────── -->
  <!-- Arrow spans from left edge of horn mouth (x=68) to right yoke back (x=535) -->
  <line x1="68" y1="435" x2="535" y2="435"
        stroke="#fcd34d" stroke-width="1"
        marker-start="url(#arr-rev)" marker-end="url(#arr)"/>
  <!-- Tick lines dropping from mouth rim and back panel -->
  <line x1="68" y1="407" x2="68" y2="440"  stroke="#4b5563" stroke-width="0.75"/>
  <line x1="535" y1="292" x2="535" y2="440" stroke="#4b5563" stroke-width="0.75"/>
  <text x="300" y="452" class="dim">658 (25.9″) DEPTH</text>

  <!-- Horn mouth height indicator — left side vertical ────────────────── -->
  <line x1="40" y1="93"  x2="40" y2="407"
        stroke="#fcd34d" stroke-width="1"
        marker-start="url(#arr-rev)" marker-end="url(#arr)"/>
  <line x1="40" y1="93"  x2="100" y2="93"  stroke="#4b5563" stroke-width="0.75"/>
  <line x1="40" y1="407" x2="100" y2="407" stroke="#4b5563" stroke-width="0.75"/>
  <text transform="translate(28,250) rotate(-90)" class="dim" text-anchor="middle">HORN MOUTH</text>

  <!-- ── Footer labels ─────────────────────────────────────────────────── -->
  <text x="300" y="472" class="lbl">VOID AIR MOTION V2</text>
  <text x="300" y="485" class="sub">Side elevation · Proportional scale, not 1:1 · Depth: 658mm (25.9″)</text>

</svg>
