<?xml version="1.0" encoding="UTF-8"?>
<!--
  Speaker: VOID Venu 215 V2 — top-down plan
  Source PNG: 05-speaker-assets/png/void-venu-215-v2-dims.png
  Actual dimensions: W 860mm × D 636mm (top plan view)
  M8 Fixtures: 8 positions, 80mm inset from each corner edge
  Centre fixture span: 350mm (13.8")
  Drawn: 2026-04-28
  Methodology: 06-reference-docs/svg-drawing-methodology.md
-->
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 800 550" width="800" height="550"
     role="img"
     aria-labelledby="venu215-top-title venu215-top-desc">

  <title id="venu215-top-title">VOID Venu 215 V2 — Top-Down Plan</title>
  <desc id="venu215-top-desc">Technical line drawing of the VOID Venu 215 V2 top-down plan view.
    Dimensions: W 860mm x D 636mm. M8 fixture positions (8 POS) documented.
    Corner handle positions: 80mm inset from each edge. Source: void-venu-215-v2-dims.png.</desc>

  <defs>
    <style>
      text { font-family: 'Segoe UI', Arial, sans-serif; }
      .lbl  { fill: #f0f6fc; font-size: 13px; font-weight: 700; text-anchor: middle; }
      .sub  { fill: #8b949e; font-size: 9px; text-anchor: middle; }
      .dim  { fill: #fcd34d; font-size: 9px; font-family: 'Segoe UI Mono', monospace; text-anchor: middle; }
      .dim-r { fill: #fcd34d; font-size: 9px; font-family: 'Segoe UI Mono', monospace; text-anchor: middle; dominant-baseline: central; }
      .dim-s { fill: #fcd34d; font-size: 8px; font-family: 'Segoe UI Mono', monospace; text-anchor: middle; }
      .dln  { stroke: #4b5563; stroke-width: 0.75; fill: none; }
      .body { fill: #1e293b; stroke: #475569; stroke-width: 1.5; }
      .hdw  { fill: #0f172a; stroke: #475569; stroke-width: 1; }
      .bolt { fill: #1e293b; stroke: #334155; stroke-width: 0.75; }
      .m8   { fill: #0a0f1a; stroke: #475569; stroke-width: 1; }
      .callout { fill: #fcd34d; font-size: 8px; font-family: 'Segoe UI Mono', monospace; text-anchor: start; }
      .callout-line { stroke: #fcd34d; stroke-width: 0.5; fill: none; }
    </style>
    <!-- Arrowhead markers -->
    <marker id="arr-t" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#fcd34d"/>
    </marker>
    <marker id="arr-t-rev" markerWidth="6" markerHeight="6" refX="1" refY="3" orient="auto-start-reverse">
      <path d="M6,0 L0,3 L6,6 Z" fill="#fcd34d"/>
    </marker>
    <!-- M8 fixture symbol: outer ring + bolt ring + inner hole -->
    <symbol id="m8-fixture" overflow="visible">
      <circle class="hdw" cx="0" cy="0" r="16"/>
      <circle class="bolt" cx="0" cy="0" r="11"/>
      <circle class="m8" cx="0" cy="0" r="6"/>
      <line x1="-11" y1="0" x2="11" y2="0" stroke="#475569" stroke-width="0.5"/>
      <line x1="0" y1="-11" x2="0" y2="11" stroke="#475569" stroke-width="0.5"/>
    </symbol>
  </defs>

  <!-- ── Background ──────────────────────────────────────────────────── -->
  <rect width="800" height="550" fill="#0d1117"/>

  <!-- ── Enclosure top panel ─────────────────────────────────────────── -->
  <!-- Body: x=45..755 (710px wide) = 860mm @ 0.826 px/mm                -->
  <!--       y=32..452 (420px tall) = 636mm @ 0.660 px/mm                -->
  <rect class="body" x="45" y="32" width="710" height="420" rx="8"/>

  <!-- ── Perimeter edge bands (top surface rim) ─────────────────────── -->
  <rect x="45" y="32" width="710" height="18" rx="8" fill="#243048" stroke="#475569" stroke-width="0.5"/>
  <rect x="45" y="434" width="710" height="18" rx="8" fill="#243048" stroke="#475569" stroke-width="0.5"/>
  <rect x="45" y="32" width="18" height="420" rx="8" fill="#243048" stroke="#475569" stroke-width="0.5"/>
  <rect x="737" y="32" width="18" height="420" rx="8" fill="#243048" stroke="#475569" stroke-width="0.5"/>

  <!-- ── Centre longitudinal seam ──────────────────────────────────── -->
  <line x1="400" y1="32" x2="400" y2="452" stroke="#2d3f55" stroke-width="0.75"/>
  <!-- Transverse centre seam -->
  <line x1="45" y1="242" x2="755" y2="242" stroke="#2d3f55" stroke-width="0.75"/>

  <!-- ── M8 Fixtures — 8 positions ──────────────────────────────────── -->
  <!-- 80mm inset from corner edges: x_inset = 80*(710/860) = 66px       -->
  <!--                               y_inset = 80*(420/636) = 53px       -->
  <!-- Outer corners: (111,85), (689,85), (111,399), (689,399)           -->
  <!-- Inner pair (350mm span centre): 350/860*710 = 289px half = 144.5  -->
  <!--   → x at 400-145=255 and 400+145=545                              -->

  <!-- Outer top-left -->
  <use href="#m8-fixture" x="111" y="85"/>
  <!-- Outer top-right -->
  <use href="#m8-fixture" x="689" y="85"/>
  <!-- Outer bottom-left -->
  <use href="#m8-fixture" x="111" y="399"/>
  <!-- Outer bottom-right -->
  <use href="#m8-fixture" x="689" y="399"/>

  <!-- Inner top-left (350mm span) -->
  <use href="#m8-fixture" x="255" y="85"/>
  <!-- Inner top-right (350mm span) -->
  <use href="#m8-fixture" x="545" y="85"/>
  <!-- Inner bottom-left -->
  <use href="#m8-fixture" x="255" y="399"/>
  <!-- Inner bottom-right -->
  <use href="#m8-fixture" x="545" y="399"/>

  <!-- ── 80mm offset dimensions (top edge, left side) ─────────────── -->
  <line class="dln" x1="45" y1="68" x2="111" y2="68"
        marker-start="url(#arr-t-rev)" marker-end="url(#arr-t)"/>
  <line class="dln" x1="45" y1="62" x2="45" y2="74"/>
  <line class="dln" x1="111" y1="62" x2="111" y2="74"/>
  <text class="dim-s" x="78" y="62">80mm</text>
  <text class="dim-s" x="78" y="75">(3.1")</text>

  <!-- 80mm offset top right -->
  <line class="dln" x1="689" y1="68" x2="755" y2="68"
        marker-start="url(#arr-t-rev)" marker-end="url(#arr-t)"/>
  <line class="dln" x1="689" y1="62" x2="689" y2="74"/>
  <line class="dln" x1="755" y1="62" x2="755" y2="74"/>
  <text class="dim-s" x="722" y="62">80mm</text>
  <text class="dim-s" x="722" y="75">(3.1")</text>

  <!-- 80mm offset left side, top -->
  <line class="dln" x1="28" y1="32" x2="28" y2="85"
        marker-start="url(#arr-t-rev)" marker-end="url(#arr-t)"/>
  <line class="dln" x1="22" y1="32" x2="34" y2="32"/>
  <line class="dln" x1="22" y1="85" x2="34" y2="85"/>
  <text class="dim-s" x="28" y="58" transform="rotate(-90,28,58)">80mm (3.1")</text>

  <!-- ── Centre span dimension (350mm) ─────────────────────────────── -->
  <line class="dln" x1="255" y1="115" x2="545" y2="115"
        marker-start="url(#arr-t-rev)" marker-end="url(#arr-t)"/>
  <line class="dln" x1="255" y1="108" x2="255" y2="122"/>
  <line class="dln" x1="545" y1="108" x2="545" y2="122"/>
  <text class="dim-s" x="400" y="130">350 mm  (13.8")</text>

  <!-- ── Main width dimension — below panel ─────────────────────────── -->
  <line class="dln" x1="45" y1="468" x2="755" y2="468"
        marker-start="url(#arr-t-rev)" marker-end="url(#arr-t)"/>
  <line class="dln" x1="45" y1="459" x2="45" y2="477"/>
  <line class="dln" x1="755" y1="459" x2="755" y2="477"/>
  <text class="dim" x="400" y="485">860 mm  (33.9")</text>

  <!-- ── Main depth dimension — right of panel ──────────────────────── -->
  <line class="dln" x1="772" y1="32" x2="772" y2="452"
        marker-start="url(#arr-t-rev)" marker-end="url(#arr-t)"/>
  <line class="dln" x1="763" y1="32" x2="781" y2="32"/>
  <line class="dln" x1="763" y1="452" x2="781" y2="452"/>
  <text class="dim-r" x="791" y="242" transform="rotate(90,791,242)">636 mm  (25.0")</text>

  <!-- ── M8 Fixtures callout ────────────────────────────────────────── -->
  <line class="callout-line" x1="111" y1="85" x2="78" y2="24"/>
  <text class="callout" x="80" y="22">M8 Fixtures (8 POS)</text>

  <!-- ── Labels ─────────────────────────────────────────────────────── -->
  <text class="lbl" x="400" y="519">VOID VENU 215 V2</text>
  <text class="sub" x="400" y="536">DJ Booth Subwoofer · 2× 15" LF · Top-Down Plan</text>

</svg>
