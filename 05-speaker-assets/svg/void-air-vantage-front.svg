<?xml version="1.0" encoding="UTF-8"?>
<!--
  Speaker: VOID Air Vantage — front elevation
  Source PNG: 05-speaker-assets/png/void-air-vantage-dims.png
  Actual dimensions: W 719mm × H 415mm × D 660mm
  Driver(s): ~300mm LF woofer (bowl), large horn waveguide (HF)
  Drawn: 2026-04-28
  Issue: #14
  Methodology: 06-reference-docs/svg-drawing-methodology.md

  Geometry notes
  ──────────────
  The Vantage is a trapezoidal DJ monitor — wider at the top, narrowing
  toward the bottom. The front face shows:
    • A large waveguide horn (diamond/lens profile) in the upper centre,
      with concentric rounded-rect rings indicating the horn mouth layers.
    • A hemispherical LF woofer bowl in the lower centre.
    • Dashed lines in the source indicate the angled side walls sweeping
      inward as they descend (trapezoid).

  Canvas: 700 × 500, scale ≈ 0.97 px/mm (719mm → 620px top width)
  Cabinet top width  : 620 px  (≈ 719mm × 0.862 scale, margin-adjusted)
  Cabinet bot width  : 400 px  (proportional — narrower at base)
  Cabinet height     : 360 px  (≈ 415mm × 0.867)
  Trapezoid corners  : top-left (40,60), top-right(660,60),
                       bot-right(590,420), bot-left(110,420)
  Waveguide centre   : cx=350, cy=195  (upper-centre)
  LF driver centre   : cx=350, cy=340  (lower-centre)
  LF driver radius   : ~80px (≈ 276mm bowl height / 2 * scale)
-->
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 700 500"
     width="700" height="500"
     role="img"
     aria-labelledby="vantage-front-title vantage-front-desc">

  <title id="vantage-front-title">VOID Air Vantage — Front Elevation</title>
  <desc id="vantage-front-desc">Technical line drawing of the VOID Air Vantage DJ monitor,
    front view. Dimensions: W 719mm (28.3″) × H 415mm (16.3″) × D 660mm (26.0″).
    Features trapezoidal cabinet, large waveguide horn, and hemispherical LF driver.
    Source: void-air-vantage-dims.png.</desc>

  <defs>
    <style>
      text { font-family: 'Segoe UI', Arial, sans-serif; }
      .lbl  { fill: #f0f6fc; font-size: 12px; font-weight: 700; text-anchor: middle; }
      .sub  { fill: #8b949e; font-size: 9px;  text-anchor: middle; }
      .dim  { fill: #fcd34d; font-size: 9px;  font-family: 'Segoe UI Mono', monospace; text-anchor: middle; }
      .dln  { stroke: #4b5563; stroke-width: 0.5; fill: none; }
      .body { fill: #1e293b; stroke: #475569; stroke-width: 1.5; }
      .drv  { fill: #111827; stroke: #334155; stroke-width: 1; }
      .horn { fill: #0f172a; stroke: #334155; stroke-width: 1; }
      .port { fill: #0a0f1a; stroke: #334155; stroke-width: 0.5; }
      .clt  { fill: none; stroke: #fcd34d; stroke-width: 0.5; stroke-dasharray: 3,2; }
      .anot { fill: #fcd34d; font-size: 8px; font-family: 'Segoe UI Mono', monospace; text-anchor: start; }
      .anotc{ fill: #fcd34d; font-size: 8px; font-family: 'Segoe UI Mono', monospace; text-anchor: middle; }
    </style>

    <!-- Dimension arrowhead markers -->
    <marker id="arr" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#fcd34d"/>
    </marker>
    <marker id="arr-rev" markerWidth="6" markerHeight="6" refX="1" refY="3"
            orient="auto-start-reverse">
      <path d="M6,0 L0,3 L6,6 Z" fill="#fcd34d"/>
    </marker>
  </defs>

  <!-- ── Background ──────────────────────────────────────────────────── -->
  <rect width="700" height="500" fill="#0d1117"/>

  <!-- ── Cabinet body — trapezoidal front face ──────────────────────── -->
  <!-- Wider at top (40→660), narrowing at bottom (110→590)            -->
  <polygon class="body"
           points="40,60 660,60 590,420 110,420"/>

  <!-- ── Dashed guide lines showing angled side walls ──────────────── -->
  <!-- Left wall diagonal -->
  <line class="dln" x1="40" y1="60" x2="110" y2="420"
        stroke-dasharray="4,3"/>
  <!-- Right wall diagonal -->
  <line class="dln" x1="660" y1="60" x2="590" y2="420"
        stroke-dasharray="4,3"/>

  <!-- ══════════════════════════════════════════════════════════════════
       WAVEGUIDE HORN — upper centre
       Large lens/diamond-profile horn with concentric ring layers.
       Outer mouth: ~220×120px ellipse; inner rings step inward.
       ══════════════════════════════════════════════════════════════════ -->
  <!-- Outermost horn mouth ring (grille surround) -->
  <rect class="horn" x="180" y="110" width="340" height="180" rx="55" ry="55"/>
  <!-- Second ring -->
  <rect class="horn" x="205" y="128" width="290" height="144" rx="44" ry="44"
        stroke="#475569" stroke-width="0.8"/>
  <!-- Third ring -->
  <rect class="horn" x="232" y="148" width="236" height="104" rx="34" ry="34"
        stroke="#334155"/>
  <!-- Fourth ring (inner horn wall) -->
  <rect class="horn" x="258" y="164" width="184" height="72"  rx="26" ry="26"
        stroke="#1e293b" fill="#111827"/>
  <!-- Central compression driver face (circle) -->
  <circle class="drv" cx="350" cy="200" r="28" stroke="#475569"/>
  <!-- Dust cap / phase plug detail -->
  <circle fill="#1e293b" stroke="#334155" stroke-width="0.8"
          cx="350" cy="200" r="14"/>
  <circle fill="#0a0f1a" cx="350" cy="200" r="5"/>

  <!-- ── Callout: WAVEGUIDE HORN ─────────────────────────────────────── -->
  <line class="clt" x1="350" y1="148" x2="350" y2="98"/>
  <line class="clt" x1="350" y1="98"  x2="460" y2="80"/>
  <text class="anot" x="465" y="83">WAVEGUIDE HORN</text>

  <!-- ══════════════════════════════════════════════════════════════════
       LF DRIVER — lower centre hemispherical bowl
       Source dims: 276mm bowl height, 305mm half-width.
       Scaled: radius ≈ 83px; bowl clip gives hemisphere look.
       ══════════════════════════════════════════════════════════════════ -->
  <!-- Outer surround ring -->
  <circle class="drv" cx="350" cy="337" r="83" stroke="#475569"/>
  <!-- Mid surround ring -->
  <circle class="drv" cx="350" cy="337" r="68" stroke="#334155"/>
  <!-- Cone ring -->
  <circle class="drv" cx="350" cy="337" r="52" fill="#0f172a" stroke="#334155"/>
  <!-- Inner cone -->
  <circle fill="#111827" stroke="#334155" stroke-width="0.8"
          cx="350" cy="337" r="36"/>
  <!-- Dust cap -->
  <circle fill="#1e293b" stroke="#475569" stroke-width="0.8"
          cx="350" cy="337" r="18"/>
  <!-- Phase plug -->
  <circle fill="#0a0f1a" cx="350" cy="337" r="7"/>

  <!-- ── Callout: LF DRIVER ──────────────────────────────────────────── -->
  <line class="clt" x1="350" y1="420" x2="350" y2="452"/>
  <line class="clt" x1="350" y1="452" x2="240" y2="452"/>
  <text class="anot" x="100" y="455" text-anchor="end">LF DRIVER</text>
  <line class="clt" x1="100" y1="452" x2="240" y2="452"/>

  <!-- ── Small connector port at bottom centre ──────────────────────── -->
  <!-- Source shows a small rectangular recess at bottom-centre         -->
  <rect class="port" x="325" y="408" width="50" height="8" rx="1"/>

  <!-- ══════════════════════════════════════════════════════════════════
       DIMENSION LINES
       ══════════════════════════════════════════════════════════════════ -->

  <!-- Width dimension — horizontal, above enclosure -->
  <line class="dln" marker-start="url(#arr-rev)" marker-end="url(#arr)"
        x1="40" y1="38" x2="660" y2="38"/>
  <!-- Tick marks at ends -->
  <line class="dln" x1="40"  y1="32" x2="40"  y2="58"/>
  <line class="dln" x1="660" y1="32" x2="660" y2="58"/>
  <text class="dim" x="350" y="30">719 mm (28.3″)</text>

  <!-- Height dimension — vertical, right of enclosure -->
  <line class="dln" marker-start="url(#arr-rev)" marker-end="url(#arr)"
        x1="678" y1="60" x2="678" y2="420"/>
  <line class="dln" x1="656" y1="60"  x2="684" y2="60"/>
  <line class="dln" x1="656" y1="420" x2="684" y2="420"/>
  <text class="dim" x="692" y="240"
        transform="rotate(90,692,240)">415 mm (16.3″)</text>

  <!-- ── Labels ──────────────────────────────────────────────────────── -->
  <text class="lbl" x="350" y="480">VOID AIR VANTAGE</text>
  <text class="sub" x="350" y="493">DJ Monitor · 719 × 415 × 660 mm · W28.3 × H16.3 × D26.0″</text>

</svg>
