# Affected-based CI (EMBLEM-NLP SOP §3.1). Only packages touched by a change — and
# their dependents — are built/linted, via `turbo run ... --filter=...[base]`.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Turbo needs full history to diff against the base for affected detection.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-lint:
    name: Build · Lint · Architecture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # SOP §4.2.1 — boundary rules are a required gate (no-circular, barrel imports).
      - name: Architecture validation (dependency-cruiser)
        run: pnpm depcruise

      # SOP §3.1 — affected-based. On PRs, diff vs the target branch; on push, vs previous commit.
      - name: Build (affected)
        run: pnpm exec turbo run build --filter="...[${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || 'HEAD^1' }}]"

      - name: Lint (affected)
        run: pnpm exec turbo run lint --filter="...[${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || 'HEAD^1' }}]"
