<title id="sf-title">Nomad Toronto — AV Signal Flow</title>
<desc id="sf-desc">Complete signal flow for Nomad Toronto VOID Acoustics system. As-built, Armonía-verified March 2026, CQ-12T confirmed April 2026.</desc>

<defs>
  <style>
    text { font-family: 'Segoe UI', Arial, sans-serif; }
    .lbl  { fill:#f0f6fc; font-size:13px; font-weight:600; text-anchor:middle; dominant-baseline:central; }
    .sub  { fill:#8b949e; font-size:10px; text-anchor:middle; dominant-baseline:central; }
    .conn { fill:#8b949e; font-size:9.5px; font-family:'Segoe UI Mono',monospace; text-anchor:middle; }
    .gain { fill:#fcd34d; font-size:10px; font-family:'Segoe UI Mono',monospace; text-anchor:middle; }
    .zone { fill:#4b5563; font-size:11px; font-weight:600; }
    .hdr  { fill:#f0f6fc; font-size:17px; font-weight:700; text-anchor:middle; }
    .foot { fill:#4b5563; font-size:9px; text-anchor:middle; }
    .offltxt { fill:#6b7280; font-size:11px; font-weight:600; text-anchor:middle; dominant-baseline:central; }
    .leg  { fill:#c9d1d9; font-size:10px; dominant-baseline:central; }
  </style>

  <marker id="ah-foh"  markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto"><path d="M0,0 L0,7 L7,3.5z" fill="#f97316"/></marker>
  <marker id="ah-booth" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto"><path d="M0,0 L0,7 L7,3.5z" fill="#3b82f6"/></marker>
  <marker id="ah-ent"  markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto"><path d="M0,0 L0,7 L7,3.5z" fill="#10b981"/></marker>
  <marker id="ah-data" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto"><path d="M0,0 L0,7 L7,3.5z" fill="#a78bfa"/></marker>
</defs>

