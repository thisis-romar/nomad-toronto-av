</g>
<!-- Xair R-3 (right side) -->
<g transform="translate(765,380)">
  <rect x="-26" y="-26" width="52" height="52" rx="4" fill="#1a0800" stroke="#f97316" stroke-width="2.5"/>
  <text y="-6" class="lbl" font-size="10">Xair R-3</text>
  <text y="6" class="slbl">Outside</text>
  <text y="18" class="amp" fill="#f97316">V3 #2 CH2</text>
  <text y="34" class="slbl">Sub R · 4 Ω</text>
</g>

<!-- ─── ZONE 4b: Middle Subs — 4× Xair (Q5) ────────────────── -->
