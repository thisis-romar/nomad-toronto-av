</g>
<!-- Air Vantage R -->
<g transform="translate(560,565)">
  <circle r="16" fill="#1e1a40" stroke="#3b82f6" stroke-width="2"/>
  <text y="-2" class="lbl" font-size="9">Vantage</text>
  <text y="8" class="slbl">R</text>
  <text y="22" class="amp" fill="#3b82f6">Q2 #1 CH2</text>
  <text y="34" class="slbl">Booth Mon</text>
</g>
<!-- Venu 215 L -->
<g transform="translate(390,570)">
  <rect x="-18" y="-18" width="36" height="36" rx="3" fill="#1e1a40" stroke="#60a5fa" stroke-width="2"/>
  <text y="-2" class="lbl" font-size="9">Venu</text>
  <text y="8" class="slbl">L</text>
  <text y="22" class="amp" fill="#60a5fa">Q2 #1 CH3</text>
</g>
<!-- Venu 215 R -->
<g transform="translate(480,570)">
  <rect x="-18" y="-18" width="36" height="36" rx="3" fill="#1e1a40" stroke="#60a5fa" stroke-width="2"/>
  <text y="-2" class="lbl" font-size="9">Venu</text>
  <text y="8" class="slbl">R</text>
  <text y="22" class="amp" fill="#60a5fa">Q2 #1 CH4</text>
