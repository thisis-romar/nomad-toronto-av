<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 760" width="1000" height="760"
     role="img" aria-labelledby="zm-title zm-desc">
<title id="zm-title">Nomad Toronto — Speaker Zone Map</title>
<desc id="zm-desc">Top-down schematic showing speaker zone assignments for Nomad Toronto VOID Acoustics installation. 18 speakers across 5 zones.</desc>

<defs>
  <style>
    text { font-family: 'Segoe UI', Arial, sans-serif; }
    .hdr   { fill:#f0f6fc; font-size:16px; font-weight:700; text-anchor:middle; }
    .sub   { fill:#8b949e; font-size:10px; text-anchor:middle; }
    .lbl   { fill:#f0f6fc; font-size:11px; font-weight:600; text-anchor:middle; dominant-baseline:central; }
    .slbl  { fill:#c9d1d9; font-size:9.5px;  text-anchor:middle; dominant-baseline:central; }
    .amp   { fill:#fcd34d; font-size:9px;  text-anchor:middle; dominant-baseline:central; }
    .zone  { font-size:11px; font-weight:700; }
    .wall  { fill:#1e293b; stroke:#334155; stroke-width:2; }
    .floor { fill:#0f172a; }
    .booth-bg { fill:#1e1a2e; stroke:#7c3aed; stroke-width:1.5; stroke-dasharray:6,3; }
    .rack  { fill:#1c2a1c; stroke:#22c55e; stroke-width:1.5; }
    .foot  { fill:#4b5563; font-size:9px; text-anchor:middle; }
    .leg   { fill:#c9d1d9; font-size:10px; dominant-baseline:central; }
    .dim   { fill:#4b5563; font-size:9px; text-anchor:middle; }
  </style>

  <!-- Speaker symbols as reusable markers -->
  <!-- FOH sub (Xair) — large square, orange -->
  <!-- FOH main (Air Motion) — large circle, orange -->
  <!-- FOH fill (Airten) — medium diamond, orange -->
  <!-- Booth monitor (Air Vantage) — small circle, blue -->
  <!-- Booth sub (Venu 215) — small square, blue -->
  <!-- Entrance (Athens) — small circle, green -->
</defs>

<!-- ── Background ────────────────────────────────────────────── -->
<rect width="1000" height="760" fill="#0d1117"/>

<!-- ── Header ─────────────────────────────────────────────────── -->
<text x="500" y="20" class="hdr">NOMAD TORONTO — SPEAKER ZONE MAP</text>
<text x="500" y="35" class="sub">Top-down schematic · 18 speakers · 5 amplifier zones · VOID Acoustics system</text>

<!-- ══════════════════════════════════════════════════════════════
     VENUE FOOTPRINT
     Outer walls: x=60, y=55, w=750, h=590
     Scale: approximate — not to architectural scale
     ══════════════════════════════════════════════════════════════ -->

<!-- Outer walls -->
<rect x="60" y="55" width="750" height="590" rx="4" fill="none" stroke="#475569" stroke-width="3"/>

<!-- Floor fill -->
<rect x="63" y="58" width="744" height="584" fill="#0f172a"/>

<!-- ── ENTRANCE zone (top, y=58–155) ───────────────────────────── -->
<rect x="63" y="58" width="744" height="97" fill="#10b981" opacity="0.06"/>
<text x="435" y="75" class="zone" fill="#10b981" text-anchor="middle">ENTRANCE / FOYER</text>
<!-- Entrance door opening in top wall -->
<rect x="330" y="55" width="210" height="6" fill="#0d1117"/>
<text x="435" y="62" class="dim">◂ entrance ▸</text>

<!-- ── BAR zone label (sides, decorative) ──────────────────────── -->
<text x="75" y="340" class="dim" text-anchor="start" transform="rotate(-90,75,340)">BAR</text>
<text x="800" y="340" class="dim" text-anchor="start" transform="rotate(90,800,340)">BAR</text>

<!-- ── DANCE FLOOR (center, y=155–490) ───────────────────────────── -->
<rect x="130" y="155" width="610" height="335" rx="6" fill="#131a27" stroke="#1e3a5f" stroke-width="1"/>
<text x="435" y="325" class="dim">DANCE FLOOR</text>

<!-- ── DJ BOOTH (bottom center, y=490–600) ───────────────────────── -->
<rect x="280" y="490" width="310" height="110" rx="4" class="booth-bg"/>
<text x="435" y="510" class="zone" fill="#a855f7" text-anchor="middle">DJ BOOTH</text>
<text x="435" y="524" class="slbl" fill="#9ca3af">Pioneer DJM-V10 · 4× CDJ-3000</text>
<text x="435" y="537" class="slbl" fill="#9ca3af">Allen &amp; Heath CQ-12T</text>

<!-- Amp rack -->
<rect x="68" y="490" width="80" height="110" rx="3" class="rack"/>
<text x="108" y="532" class="lbl" fill="#22c55e" font-size="10">AMP</text>
<text x="108" y="546" class="lbl" fill="#22c55e" font-size="10">RACK</text>
<text x="108" y="562" class="slbl" fill="#4ade80">5× Bias amps</text>
<text x="108" y="574" class="slbl" fill="#4ade80">SP2120</text>

<!-- Rack connection line to booth -->
<line x1="148" y1="545" x2="280" y2="545" stroke="#22c55e" stroke-width="1" stroke-dasharray="4,3"/>

<!-- ══════════════════════════════════════════════════════════════
     SPEAKER POSITIONS
     ══════════════════════════════════════════════════════════════ -->

<!-- ─── ZONE 1: Entrance — Athens ×2 (green) ────────────────── -->
<!-- Athens L -->
<g transform="translate(200,110)">
  <circle r="20" fill="#064e3b" stroke="#10b981" stroke-width="2"/>
  <text y="-1" class="lbl" font-size="10">Athens</text>
  <text y="10" class="slbl">L</text>
  <text y="28" class="amp" fill="#10b981">self-pwr</text>
  <text y="40" class="slbl">entrance</text>
</g>
<!-- Athens R -->
<g transform="translate(670,110)">
  <circle r="20" fill="#064e3b" stroke="#10b981" stroke-width="2"/>
  <text y="-1" class="lbl" font-size="10">Athens</text>
  <text y="10" class="slbl">R</text>
  <text y="28" class="amp" fill="#10b981">self-pwr</text>
  <text y="40" class="slbl">entrance</text>
</g>
<!-- Athens signal lines from CQ-12T BakFil (from left side near rack) -->
<line x1="200" y1="130" x2="200" y2="155" stroke="#10b981" stroke-width="1" stroke-dasharray="4,3" opacity="0.5"/>
<line x1="670" y1="130" x2="670" y2="155" stroke="#10b981" stroke-width="1" stroke-dasharray="4,3" opacity="0.5"/>

<!-- ─── ZONE 2: FOH Mains — Air Motion V2 ×2 (orange, ceiling C) ── -->
<!-- Air Motion L (ceiling, upper-left of dance floor) -->
<g transform="translate(240,200)">
  <circle r="26" fill="#431407" stroke="#f97316" stroke-width="2.5"/>
  <text y="-4" class="lbl">Air Motion</text>
  <text y="8" class="slbl">V2 Red L</text>
  <text y="22" class="amp" fill="#f97316">Q2 #2 bi-amp</text>
  <text y="36" class="slbl">FOH Main</text>
</g>
<!-- Air Motion R -->
<g transform="translate(630,200)">
  <circle r="26" fill="#431407" stroke="#f97316" stroke-width="2.5"/>
  <text y="-4" class="lbl">Air Motion</text>
  <text y="8" class="slbl">V2 Red R</text>
  <text y="22" class="amp" fill="#f97316">Q2 #2 bi-amp</text>
  <text y="36" class="slbl">FOH Main</text>
</g>

<!-- ─── ZONE 3: FOH Fill — Airten V3 ×2 ─────────────────────── -->
<!-- Airten L (upper-left flank) -->
<g transform="translate(155,240)">
  <polygon points="0,-20 18,10 -18,10" fill="#2d1b00" stroke="#fb923c" stroke-width="2"/>
  <text y="22" class="lbl" font-size="10">Airten V3</text>
  <text y="34" class="slbl">L</text>
  <text y="48" class="amp" fill="#fb923c">V3 #1</text>
  <text y="60" class="slbl">FOH Fill</text>
</g>
<!-- Airten R (upper-right flank) -->
<g transform="translate(715,240)">
  <polygon points="0,-20 18,10 -18,10" fill="#2d1b00" stroke="#fb923c" stroke-width="2"/>
  <text y="22" class="lbl" font-size="10">Airten V3</text>
  <text y="34" class="slbl">R</text>
  <text y="48" class="amp" fill="#fb923c">V3 #1</text>
  <text y="60" class="slbl">FOH Fill</text>
</g>

<!-- ─── ZONE 4: Outside Subs — Xair L-3, R-3 (V3#2 direct) ──── -->
<!-- Xair L-3 (left side of dance floor) -->
<g transform="translate(105,380)">
  <rect x="-26" y="-26" width="52" height="52" rx="4" fill="#1a0800" stroke="#f97316" stroke-width="2.5"/>
  <text y="-6" class="lbl" font-size="10">Xair L-3</text>
  <text y="6" class="slbl">Outside</text>
  <text y="18" class="amp" fill="#f97316">V3 #2 CH1</text>
