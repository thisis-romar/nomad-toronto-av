  <text y="8" class="amp" fill="#f97316">Q5 CH1</text>
</g>
<!-- Xair L-2 -->
<g transform="translate(360,445)">
  <rect x="-22" y="-22" width="44" height="44" rx="3" fill="#1a0800" stroke="#f97316" stroke-width="2"/>
  <text y="-3" class="lbl" font-size="9">Xair L-2</text>
  <text y="8" class="amp" fill="#f97316">Q5 CH2</text>
</g>
<!-- Xair R-1 -->
<g transform="translate(510,445)">
  <rect x="-22" y="-22" width="44" height="44" rx="3" fill="#1a0800" stroke="#f97316" stroke-width="2"/>
  <text y="-3" class="lbl" font-size="9">Xair R-1</text>
  <text y="8" class="amp" fill="#f97316">Q5 CH3</text>
</g>
<!-- Xair R-2 -->
<g transform="translate(570,445)">
  <rect x="-22" y="-22" width="44" height="44" rx="3" fill="#1a0800" stroke="#f97316" stroke-width="2"/>
  <text y="-3" class="lbl" font-size="9">Xair R-2</text>
  <text y="8" class="amp" fill="#f97316">Q5 CH4</text>
</g>
<!-- Middle sub cluster label -->
<text x="435" y="480" class="slbl">Middle sub cluster · 4 Ω each · floor</text>

<!-- ─── ZONE 5: Booth — Air Vantage ×2 + Venu 215 ×2 ─────────── -->
<!-- Air Vantage L (faces DJ, left of booth) -->
<g transform="translate(310,565)">
  <circle r="16" fill="#1e1a40" stroke="#3b82f6" stroke-width="2"/>
  <text y="-2" class="lbl" font-size="9">Vantage</text>
  <text y="8" class="slbl">L</text>
  <text y="22" class="amp" fill="#3b82f6">Q2 #1 CH1</text>
