<!-- Rack → Xair outside subs -->
<line x1="148" y1="530" x2="105" y2="380" stroke="#f97316" stroke-width="1" opacity="0.3"/>
<line x1="148" y1="530" x2="765" y2="380" stroke="#f97316" stroke-width="1" opacity="0.3"/>
