<text x="700.0" y="418.0" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#666" text-anchor="start" >Both read upright — the rotated copies right themselves in the fold.</text>
<text x="700.0" y="436.0" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#666" text-anchor="start" >Band 2 is the sacrificial one — the wrap eats it.</text>
